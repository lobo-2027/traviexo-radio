<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TRAVIEXO V35 · Editable Template</title><style>
:root{--gold:#f6bd60;--edge:#f9b74d;--glass:rgba(9,10,23,.62);--text:#fff3d8}*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:system-ui,-apple-system,sans-serif;background:#080710 url('reference-v35.png') center top/auto 100vh fixed no-repeat}body:before{content:'';position:fixed;inset:0;background:linear-gradient(180deg,#06051199,#09071166,#090711dd);pointer-events:none}main{position:relative;max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 14px 130px}.glass{background:var(--glass);border:1px solid #f6c1779e;border-radius:24px;backdrop-filter:blur(24px) saturate(130%);-webkit-backdrop-filter:blur(24px) saturate(130%);box-shadow:inset 0 1px #fff5,0 9px 30px #0008}header{text-align:center;padding:16px;margin-bottom:18px}h1{margin:0;font-size:clamp(23px,6vw,39px);color:#ffda95;text-shadow:0 0 16px #f5a434}header p{margin:5px;font-size:12px;letter-spacing:3px}.player{padding:15px;margin-bottom:14px}.player-top{display:flex;align-items:center;gap:12px}.logo{width:58px;height:58px;border-radius:15px;object-fit:cover;object-position:12% 18%;border:1px solid var(--gold)}.station{flex:1;min-width:0}.station strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:18px}.station small{opacity:.75}.player-actions{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}button{font:inherit;color:inherit;cursor:pointer;border:1px solid #e6b56e8c;background:#251d31b0;border-radius:16px;padding:11px 14px;min-height:44px}button:focus-visible{outline:2px solid white}button.active{background:#9c5a1d8a;border-color:#ffdf9a}.play{border-radius:50%;width:65px;height:65px;font-size:25px;background:radial-gradient(#7c4c27,#140d1b);box-shadow:0 0 16px #ffac3877}.fold{margin-left:auto;font-size:13px}.player.collapsed .player-actions,.player.collapsed .player-status{display:none}.player.collapsed .logo{width:38px;height:38px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}.tabs button{padding:10px 3px;font-size:13px}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.filters button{font-size:12px;padding:9px 3px}.list{padding:12px}.list h2{font-size:16px;margin:4px 5px 12px}.item{width:100%;display:flex;align-items:center;gap:10px;text-align:left;margin:6px 0;border-radius:13px}.item .emoji{font-size:24px}.item .info{flex:1;min-width:0}.item small{display:block;opacity:.72}.heart{font-size:24px;border:0;background:none;padding:4px}.note{font-size:12px;opacity:.8;line-height:1.5}.hide{display:none!important}footer{margin-top:14px;text-align:center}a{color:#ffdda5}@media(min-width:600px){.filters{grid-template-columns:repeat(6,1fr)}}
</style></head><body><main><header class="glass"><h1>TRAVIEXO RADIO</h1><p>CELESTIAL GOLD · V35 TEMPLATE</p></header><section class="player glass" id="player"><div class="player-top"><img class="logo" src="reference-v35.png" alt="Lobo celestial"><div class="station"><strong id="current">Selecciona una estación</strong><small id="status">Vista previa · sin transmisión conectada</small></div><button class="fold" id="fold" aria-expanded="true">Guardar ⌄</button></div><div class="player-actions"><button id="prev" aria-label="Anterior">◀❚</button><button class="play" id="play" aria-label="Reproducir">▶</button><button id="next" aria-label="Siguiente">❚▶</button><button id="fav" aria-label="Favorito">♡</button></div></section><nav class="tabs"><button data-tab="stations" class="active">🎵 Estaciones</button><button data-tab="favorites">♡ Favoritas</button><button data-tab="recent">◷ Recientes</button></nav><nav class="filters" id="filters"><button data-filter="all" class="active">Todas</button><button data-filter="mexico">🇲🇽 México</button><button data-filter="usa">🇺🇸 USA</button><button data-filter="latinas">🎶 Latinas</button><button data-filter="cristianas">✝ Cristianas</button><button data-filter="more">☷ Más</button></nav><section class="glass list"><h2 id="heading">Explorar estaciones</h2><div id="stations"></div></section><footer class="note">Directorio Radio Browser: la disponibilidad de cada transmisión depende de la emisora. Univision utiliza su reproductor oficial.</footer></main><script>
const $=id=>document.getElementById(id);
const audio=document.createElement('audio');audio.preload='none';audio.setAttribute('playsinline','');document.body.append(audio);
let stations=[],selected=-1,tab='stations',filter='all',favorites=[],recent=[],request=0,searchText='';
const load=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return []}};
favorites=load('traviexo_v35_favorites');recent=load('traviexo_v35_recent');
const save=()=>{try{localStorage.setItem('traviexo_v35_favorites',JSON.stringify(favorites));localStorage.setItem('traviexo_v35_recent',JSON.stringify(recent))}catch{}};
const status=t=>$('status').textContent=t;
const clean=x=>({id:x.stationuuid,name:x.name||'Sin nombre',desc:[x.country,x.tags?.split(',').slice(0,2).join(' · ')].filter(Boolean).join(' · '),url:x.url_resolved||x.url});
function update(){const x=stations[selected];$('current').textContent=x?.name||'Selecciona una estación';$('play').textContent=!audio.paused?'Ⅱ':'▶';$('fav').textContent=x&&favorites.some(y=>y.id===x.id)?'♥':'♡'}
async function search(){const token=++request;status('Buscando estaciones…');const p=new URLSearchParams({hidebroken:'true',order:'votes',reverse:'true',limit:'60'});if(searchText)p.set('name',searchText);else if(filter==='mexico')p.set('countrycode','MX');else if(filter==='usa')p.set('countrycode','US');else if(filter==='latinas')p.set('language','spanish');else if(filter==='cristianas')p.set('tag','christian');else if(filter==='more')p.set('tag','classical');try{const response=await fetch('https://de1.api.radio-browser.info/json/stations/search?'+p);if(!response.ok)throw Error('HTTP '+response.status);const rows=await response.json();if(token!==request)return;stations=rows.map(clean).filter(x=>x.id&&x.url&&x.url.startsWith('https://'));selected=-1;status(stations.length+' estaciones encontradas');render()}catch(e){status('Directorio no disponible. Inténtalo más tarde.');render()}}
function choose(i){if(!stations[i])return;selected=i;const x=stations[i];recent=[x,...recent.filter(y=>y.id!==x.id)].slice(0,20);save();audio.pause();audio.src=x.url;status('Conectando…');update();audio.play().then(()=>{status('Reproduciendo · radio pública');update()}).catch(()=>{status('Esta emisora no se pudo reproducir. Prueba otra.');update()});render()}
audio.addEventListener('playing',()=>{status('Reproduciendo · radio pública');update()});audio.addEventListener('pause',update);audio.addEventListener('error',()=>{status('Transmisión no disponible en Safari');update()});
function render(){const heading=$('heading'),container=$('stations');heading.textContent=tab==='favorites'?'Mis favoritas':tab==='recent'?'Escuchadas recientemente':'Explorar estaciones';container.replaceChildren();const data=tab==='favorites'?favorites:tab==='recent'?recent:stations;if(!data.length){container.textContent='No hay estaciones en esta sección.';return}for(const x of data){const row=document.createElement('button');row.className='item';const emoji=document.createElement('span');emoji.className='emoji';emoji.textContent='📻';const info=document.createElement('span');info.className='info';const title=document.createElement('strong');title.textContent=x.name;const small=document.createElement('small');small.textContent=x.desc;info.append(title,small);const heart=document.createElement('span');heart.textContent=favorites.some(y=>y.id===x.id)?'♥':'▶';row.append(emoji,info,heart);row.onclick=()=>{let i=stations.findIndex(y=>y.id===x.id);if(i<0){stations.unshift(x);i=0}choose(i)};container.append(row)}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;searchText='';document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));tab='stations';document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab==='stations'));search()});
$('play').onclick=()=>{if(selected<0){status('Selecciona primero una estación');return}if(!audio.paused){audio.pause();status('En pausa')}else audio.play().catch(()=>status('No se pudo reanudar'))};
$('prev').onclick=()=>{if(stations.length)choose((selected-1+stations.length)%stations.length)};
$('next').onclick=()=>{if(stations.length)choose((selected+1)%stations.length)};
$('fav').onclick=()=>{const x=stations[selected];if(!x)return;favorites=favorites.some(y=>y.id===x.id)?favorites.filter(y=>y.id!==x.id):[x,...favorites];save();update();render()};
$('fold').onclick=()=>{const folded=$('player').classList.toggle('collapsed');$('fold').textContent=folded?'Desplegar ⌃':'Guardar ⌄';$('fold').setAttribute('aria-expanded',String(!folded));try{localStorage.setItem('v35_folded',folded?'1':'0')}catch{}};
try{if(localStorage.getItem('v35_folded')==='1')$('fold').click()}catch{}
const input=document.createElement('input');input.placeholder='Buscar estación por nombre';input.setAttribute('aria-label','Buscar estación');input.style.cssText='width:100%;padding:13px;margin-bottom:10px;border-radius:12px;background:#140f22e0;color:white;border:1px solid #c99c60;font-size:16px';const find=document.createElement('button');find.textContent='Buscar';find.onclick=()=>{searchText=input.value.trim();search()};input.onkeydown=e=>{if(e.key==='Enter')find.click()};$('heading').before(input,find);
const official=document.createElement('section');official.className='glass';official.style.cssText='padding:14px;margin:14px 0';const h=document.createElement('strong');h.textContent='📻 Univision / Uforia';const p=document.createElement('p');p.textContent='Catálogo oficial dentro de TRAVIEXO. Usa su propio reproductor.';const open=document.createElement('button');open.textContent='Abrir Univision';const close=document.createElement('button');close.textContent='Cerrar';close.hidden=true;const frame=document.createElement('iframe');frame.title='Univision Radio';frame.allow='autoplay; encrypted-media';frame.style.cssText='width:100%;height:510px;border:1px solid #c99c60;border-radius:12px;background:white';frame.hidden=true;open.onclick=()=>{frame.src='https://www.univision.com/radio';frame.hidden=false;close.hidden=false};close.onclick=()=>{frame.src='about:blank';frame.hidden=true;close.hidden=true};official.append(h,p,open,close,frame);$('stations').parentElement.after(official);
status('Radio lista · selecciona una estación');search();
</script></body></html>
