<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100b09"><title>TRAVIEXO MUSIC · Artistas Premium V3</title><style>
:root{--gold:#f4c879;--edge:#b8894b;--ink:#100b09;--muted:#c4a77d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 15%,#38200f 0%,transparent 45%),#090809;color:#f7e5c8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100dvh}button,input{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:10;padding:calc(env(safe-area-inset-top) + 10px) 14px 12px;background:linear-gradient(#100b09f5,#100b09db);backdrop-filter:blur(18px);border-bottom:1px solid #c2924a65}.brand{text-align:center;letter-spacing:.17em;color:var(--gold);font-size:clamp(19px,5vw,28px);font-weight:800;text-shadow:0 0 22px #df922a70;margin:0 0 9px}.player{border:1px solid var(--edge);border-radius:20px;padding:12px;background:linear-gradient(120deg,#24140ba6,#090808b8);box-shadow:0 0 18px #b7752426}.playing{text-align:center;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{text-align:center;color:var(--muted);font-size:12px;margin-top:4px}.controls{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}.controls button{border:1px solid var(--edge);background:#2218109c;color:var(--gold);border-radius:12px;width:58px;height:40px;font-size:20px}.controls button.main{border:2px solid var(--gold);width:52px;height:46px;border-radius:15px;background:#3d2915}.progress{height:3px;background:#5e4630;margin-top:11px;border-radius:4px;overflow:hidden}.progress>div{height:100%;background:var(--gold);width:0%}main{max-width:900px;margin:auto;padding:22px 15px 60px}.top{display:flex;align-items:center;gap:12px;margin:2px 0 17px}.back{border:1px solid var(--edge);border-radius:13px;background:#302015;color:var(--gold);padding:10px 13px}.top h1{font-size:25px;margin:0}.hint{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 19px}.search{width:100%;border:1px solid var(--edge);border-radius:14px;background:#0b0a0a;color:white;padding:15px;font-size:16px;outline:none;margin-bottom:16px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:18px}.tabs button{border:1px solid #8b683e;background:#201710;color:var(--gold);border-radius:13px;padding:12px 2px}.tabs button.active{background:linear-gradient(135deg,#d6a45d,#65401d);color:#fff1d4;box-shadow:0 0 13px #b77b2e66}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tile{border:1px solid var(--edge);border-radius:20px;background:linear-gradient(150deg,#291b13,#0b0909 75%);padding:9px;min-width:0;text-align:left;color:#fff;box-shadow:0 4px 18px #0008}.art{aspect-ratio:1/1;border-radius:14px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 52% 33%,var(--light),transparent 55%),linear-gradient(150deg,var(--base),#09090f);border:1px solid #a7804c77}.art:before{content:'';position:absolute;width:70%;height:70%;border:2px solid #f4d48a7a;border-radius:50%;transform:translateY(-8%);box-shadow:0 0 25px var(--light)}.art:after{content:'♫';font-size:clamp(42px,12vw,90px);color:#ffdf9a;text-shadow:0 0 18px var(--light);position:relative}.art .artname{position:absolute;bottom:0;left:0;right:0;text-align:center;font-family:Georgia,serif;font-style:italic;color:#ffe0a1;font-size:clamp(13px,3.5vw,23px);padding:15px 5px 10px;background:linear-gradient(transparent,#070609dd);z-index:1}.tile strong{display:block;font-size:clamp(15px,4vw,19px);line-height:1.25;margin:12px 4px 5px;overflow-wrap:anywhere}.tile small{display:block;color:var(--muted);font-size:13px;margin:0 4px 7px}.empty{padding:28px;border:1px dashed var(--edge);border-radius:16px;color:var(--muted)}.songlist{display:grid;gap:10px}.song{display:flex;gap:12px;align-items:center;border:1px solid #a17a47;border-radius:14px;padding:12px;background:#1b120e;color:#ffe3b3;text-align:left;width:100%}.song .number{background:#4d3219;border-radius:10px;padding:12px}.song b{display:block}.song small{color:var(--muted)}.note{font-size:12px;color:#b9a083;margin-top:28px;text-align:center}footer{text-align:center;color:#9c805c;padding:18px;font-size:12px}@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.art:after{font-size:70px}}@media(max-width:360px){.controls button{width:48px}}

/* Refinamiento visual: acabado dorado cinematográfico, controles fijos y translúcidos */
header{background:linear-gradient(180deg,rgba(16,10,8,.94),rgba(20,11,7,.79))!important;box-shadow:0 8px 32px #0008}
header::before{content:'𝄞';position:absolute;pointer-events:none;top:18px;left:50%;transform:translateX(-50%) rotate(-13deg);font-family:Georgia,serif;font-size:138px;line-height:1;color:rgba(240,174,70,.12);text-shadow:0 0 24px #e6a43b30}
header .brand,header .player{position:relative;z-index:1}
.player{background:rgba(24,15,12,.47)!important;backdrop-filter:blur(14px) saturate(120%);-webkit-backdrop-filter:blur(14px) saturate(120%)}
.controls button{background:rgba(24,16,13,.38)!important;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);min-width:0;flex:1;max-width:68px}
.controls button.main{background:rgba(164,104,29,.22)!important;box-shadow:0 0 15px #f5bd543d}
.tile{box-shadow:0 6px 22px #0007,0 0 12px #c98b2a16}
@media(max-width:390px){.controls{gap:6px}.controls button{width:auto!important;padding:0}.brand{letter-spacing:.1em}}
</style></head><body><header><div class="brand">TRAVIEXO MUSIC</div><div class="player"><div class="playing" id="now">Selecciona una canción</div><div class="sub" id="status">Catálogo de demostración · Sin audio</div><div class="progress"><div id="bar"></div></div><div class="controls"><button aria-label="Aleatorio" id="shuffle">⤨</button><button aria-label="Anterior" id="prev">◀Ⅰ</button><button aria-label="Reproducir" class="main" id="play">▶</button><button aria-label="Siguiente" id="next">Ⅰ▶</button><button aria-label="Repetir" id="repeat">↪</button></div></div></header><main id="app"></main><footer>TRAVIEXO MUSIC · Prototipo independiente · La versión oficial no se modifica</footer><script>
const artists=[{name:'Luz de Medianoche',album:'Noches de Oro',base:'#35211a',light:'#e6a94c',songs:['Brillo de Luna','Caminos de Cristal','Último Destello']},{name:'Sonido del Barrio',album:'Ritmo de la Calle',base:'#49201d',light:'#ed7a3b',songs:['Bailando en la Plaza','Cumbia de Medianoche','Corazón Sonidero']},{name:'Horizonte Azul',album:'Entre Estrellas',base:'#142d53',light:'#58c5fc',songs:['Luz del Horizonte','Viaje Estelar','Bajo el Cielo Azul']},{name:'Alma Serena',album:'Ecos del Corazón',base:'#492037',light:'#e47fbd',songs:['Ecos de Amor','Rosa de Invierno','Volver a Soñar']}];let view='home',tab='artists',selected=null,query='',songIndex=-1,allSongs=artists.flatMap((a,i)=>a.songs.map((s,j)=>({name:s,artist:a.name,album:a.album,ai:i,si:j})));const app=document.getElementById('app');const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function tile(a,i,kind){let name=kind==='album'?a.album:a.name;return `<button class="tile" data-open="${kind}" data-id="${i}"><div class="art" style="--base:${a.base};--light:${a.light}"><span class="artname">${escapeHtml(name)}</span></div><strong>${escapeHtml(name)}</strong><small>${kind==='artist'?'1 álbum · ':''}${a.songs.length} canciones</small></button>`}function render(){let back=view!=='home'?`<button class="back" id="back">← Regresar</button>`:'';let title=view==='home'?'Explorar música':view==='artist'?artists[selected].name:view==='album'?artists[selected].album:'Canciones';let html=`<div class="top">${back}<h1>${escapeHtml(title)}</h1></div>`;if(view==='home'){html+=`<p class="hint">Explora artistas, álbumes y canciones en ventanas independientes. Este catálogo es ficticio y no incluye audio comercial.</p><input class="search" id="search" placeholder="Buscar artistas, álbumes o canciones" value="${escapeHtml(query)}"><div class="tabs">${[['artists','Artistas'],['albums','Álbumes'],['songs','Canciones']].map(([v,t])=>`<button data-tab="${v}" class="${tab===v?'active':''}">${t}</button>`).join('')}</div><div id="results"></div>`}else if(view==='artist'){let a=artists[selected];html+=`<p class="hint">Explora los álbumes de ${escapeHtml(a.name)}.</p><div class="grid">${tile(a,selected,'album')}</div>`}else if(view==='album'){let a=artists[selected];html+=`<p class="hint">${escapeHtml(a.name)} · ${a.songs.length} canciones de demostración</p><div class="songlist">${a.songs.map((s,i)=>`<button class="song" data-song="${selected}:${i}"><span class="number">♫</span><span><b>${escapeHtml(s)}</b><small>${escapeHtml(a.name)} · ${escapeHtml(a.album)}</small></span></button>`).join('')}</div>`}app.innerHTML=html;if(view==='home'){document.getElementById('search').addEventListener('input',e=>{query=e.target.value;results()});results()}}function results(){let q=query.trim().toLocaleLowerCase();let html='';if(tab==='artists'||tab==='albums'){let kind=tab==='artists'?'artist':'album';html=`<div class="grid">${artists.map((a,i)=>({a,i})).filter(({a})=>[a.name,a.album,...a.songs].some(s=>s.toLowerCase().includes(q))).map(({a,i})=>tile(a,i,kind)).join('')}</div>`}else{html=`<div class="songlist">${allSongs.filter(s=>[s.name,s.artist,s.album].some(v=>v.toLowerCase().includes(q))).map(s=>`<button class="song" data-song="${s.ai}:${s.si}"><span class="number">♫</span><span><b>${escapeHtml(s.name)}</b><small>${escapeHtml(s.artist)} · ${escapeHtml(s.album)}</small></span></button>`).join('')}</div>`}document.getElementById('results').innerHTML=html||'<div class="empty">No se encontraron resultados.</div>'}app.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.id==='back'){view=view==='album'?'artist':'home';render();window.scrollTo(0,0)}else if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.open){selected=Number(b.dataset.id);view=b.dataset.open;render();window.scrollTo(0,0)}else if(b.dataset.song){let [ai,si]=b.dataset.song.split(':').map(Number);songIndex=allSongs.findIndex(s=>s.ai===ai&&s.si===si);updatePlayer()}});function updatePlayer(){let s=allSongs[songIndex];document.getElementById('now').textContent=s?s.name:'Selecciona una canción';document.getElementById('status').textContent=s?`${s.artist} · Demo sin audio`:'Catálogo de demostración · Sin audio';document.getElementById('play').textContent='▶';document.getElementById('bar').style.width='0%'}document.getElementById('next').onclick=()=>{songIndex=(songIndex+1)%allSongs.length;updatePlayer()};document.getElementById('prev').onclick=()=>{songIndex=(songIndex+allSongs.length-1)%allSongs.length;updatePlayer()};document.getElementById('play').onclick=()=>{document.getElementById('status').textContent='Demostración visual: esta canción no tiene audio'};document.getElementById('shuffle').onclick=()=>{songIndex=Math.floor(Math.random()*allSongs.length);updatePlayer()};document.getElementById('repeat').onclick=()=>{document.getElementById('status').textContent='Repetición disponible cuando se conecte audio'};render();
</script></body></html>
