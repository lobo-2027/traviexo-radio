<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020616"><title>TRAVIEXO RADIO</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#020616;color:white;font-family:Arial,system-ui,sans-serif}body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;isolation:isolate;overflow-x:hidden;background:#020616}body::before{content:'';position:fixed;inset:-35px;z-index:-2;background:linear-gradient(180deg,#02061655,#020616a0),url('radio-art.jpg') center center/cover no-repeat;filter:blur(30px) saturate(1.25);transform:scale(1.08)}body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,#020616b8 100%)}.stage{position:relative;width:min(100%,1247px,calc(100dvh * 1247 / 1261));margin:auto;flex:none;box-shadow:0 0 45px #00cfff50,0 0 90px #c500ff2b;aspect-ratio:1247/1261;background:#060a22 url('radio-art.jpg') center/100% 100% no-repeat;overflow:hidden}.overlay{position:absolute;display:flex;align-items:center;justify-content:center}.slogan{left:21%;top:26.2%;width:58%;height:4.2%;background:linear-gradient(90deg,#02071c,#030a20 10%,#02081c 90%,#02071c);font-size:clamp(8px,1.9vw,24px);font-style:italic;text-shadow:0 0 9px #6e9cf9;white-space:nowrap}.live{left:7.7%;top:56.9%;width:13.5%;height:3.1%;border-radius:30px;background:#090a22;box-shadow:inset 0 0 10px #e52ae0,0 0 8px #e52ae0;color:#fff;font-size:clamp(8px,1.25vw,16px);font-weight:800;border:1px solid #f034ba}.clock{right:3.8%;top:32.7%;width:9.7%;height:2.1%;background:#050b23;color:#fff;font-size:clamp(8px,1.3vw,16px);font-weight:800}.play{left:10.2%;top:37.2%;width:8%;height:9%;border:0;border-radius:50%;background:transparent;color:transparent;cursor:pointer}.prev{left:3.4%;top:39.1%;width:4.5%;height:6%}.next{left:20.5%;top:39.1%;width:4.5%;height:6%}.hit{position:absolute;background:transparent;border:0;cursor:pointer;touch-action:manipulation}.play:focus-visible,.hit:focus-visible{outline:3px solid white}.volume{position:absolute;left:9.1%;top:62.2%;width:13.5%;height:2.5%;accent-color:#00dfff;opacity:.08}.volume:focus,.volume:hover{opacity:1}.notice{position:absolute;left:2%;bottom:1%;right:2%;text-align:center;font-size:clamp(8px,1.2vw,14px);background:#02091bdc;padding:4px;border-radius:7px}.missing{position:absolute;inset:0;background:#080c22;display:none;place-items:center;text-align:center;padding:25px;color:#9be8ff;font-size:20px}.stage.no-image .missing{display:grid}.stage.no-image>*:not(.missing){display:none}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:600px){.stage{width:100%;box-shadow:0 0 25px #00d5ff60,0 0 60px #e400ff35}.slogan{font-size:clamp(7px,1.9vw,12px)}.notice{font-size:9px}}
</style></head><body><main class="stage" id="stage" aria-label="TRAVIEXO RADIO, vista previa visual fiel al diseño aprobado"><div class="missing">Falta subir radio-art.jpg a esta rama de GitHub. La interfaz y sus controles ya están preparados.</div><div class="overlay slogan">Donde la música trasciende fronteras.</div><div class="overlay live" id="live">DEMO</div><div class="overlay clock" id="clock">Chicago</div><button class="hit prev" id="prev" aria-label="Programa anterior"></button><button class="hit play" id="play" aria-label="Iniciar prueba de audio"></button><button class="hit next" id="next" aria-label="Programa siguiente"></button><input class="volume" type="range" id="volume" min="0" max="100" value="20" aria-label="Volumen"><div class="notice" id="notice" aria-live="polite">Vista previa · Sin emisión en vivo ni música comercial</div></main><script>
const img=new Image();img.onload=()=>{};img.onerror=()=>document.getElementById('stage').classList.add('no-image');img.src='radio-art.jpg';const shows=['Buenos Días Musicales','México en el Corazón','Pop & Rock Total','Ritmos Latinos','Noches Románticas'];let index=2,ctx,osc,gain;const notice=document.getElementById('notice');function updateTime(){const t=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour:'numeric',minute:'2-digit',hour12:true}).format(new Date());document.getElementById('clock').textContent=t}updateTime();setInterval(updateTime,30000);function select(delta){index=(index+delta+shows.length)%shows.length;notice.textContent='Seleccionado: '+shows[index]+' · Música aún no disponible'}document.getElementById('prev').onclick=()=>select(-1);document.getElementById('next').onclick=()=>select(1);document.getElementById('play').onclick=async()=>{if(osc){osc.stop();osc.disconnect();osc=null;notice.textContent='Prueba de audio detenida';return}try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();osc=ctx.createOscillator();gain=ctx.createGain();osc.type='sine';osc.frequency.value=220;gain.gain.value=.02;osc.connect(gain);gain.connect(ctx.destination);osc.start();notice.textContent='Tono original de prueba · No es una transmisión de radio'}catch(e){notice.textContent='Audio de prueba no disponible'}};document.getElementById('volume').oninput=e=>{if(gain)gain.gain.value=Number(e.target.value)/100*.08};
</script></body></html>
