<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020616"><title>TRAVIEXO RADIO</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#020616;color:white;font-family:Arial,system-ui,sans-serif}body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;isolation:isolate;overflow-x:hidden;background:#020616}body::before{content:'';position:fixed;inset:-35px;z-index:-2;background:linear-gradient(180deg,#02061655,#020616a0),url('radio-art.jpg') center center/cover no-repeat;filter:blur(30px) saturate(1.25);transform:scale(1.08)}body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,#020616b8 100%)}.stage{position:relative;width:min(100%,1247px);margin:0 auto;flex:none;box-shadow:0 0 45px #00cfff50,0 0 90px #c500ff2b;aspect-ratio:1247/1261;background:#060a22 url('radio-art.jpg') center/100% 100% no-repeat;overflow:hidden}.overlay{position:absolute;display:flex;align-items:center;justify-content:center}.slogan{left:21%;top:26.2%;width:58%;height:4.2%;background:linear-gradient(90deg,#02071c,#030a20 10%,#02081c 90%,#02071c);font-size:clamp(8px,1.9vw,24px);font-style:italic;text-shadow:0 0 9px #6e9cf9;white-space:nowrap}.live{left:7.7%;top:56.9%;width:13.5%;height:3.1%;border-radius:30px;background:#090a22;box-shadow:inset 0 0 10px #e52ae0,0 0 8px #e52ae0;color:#fff;font-size:clamp(8px,1.25vw,16px);font-weight:800;border:1px solid #f034ba}.clock{right:3.8%;top:32.7%;width:9.7%;height:2.1%;background:#050b23;color:#fff;font-size:clamp(8px,1.3vw,16px);font-weight:800}.play{left:10.2%;top:37.2%;width:8%;height:9%;border:0;border-radius:50%;background:transparent;color:transparent;cursor:pointer}.prev{left:3.4%;top:39.1%;width:4.5%;height:6%}.next{left:20.5%;top:39.1%;width:4.5%;height:6%}.hit{position:absolute;background:transparent;border:0;cursor:pointer;touch-action:manipulation}.play:focus-visible,.hit:focus-visible{outline:3px solid white}.volume{position:absolute;left:9.1%;top:62.2%;width:13.5%;height:2.5%;accent-color:#00dfff;opacity:.08}.volume:focus,.volume:hover{opacity:1}.notice{position:absolute;left:2%;bottom:1%;right:2%;text-align:center;font-size:clamp(8px,1.2vw,14px);background:#02091bdc;padding:4px;border-radius:7px}.missing{position:absolute;inset:0;background:#080c22;display:none;place-items:center;text-align:center;padding:25px;color:#9be8ff;font-size:20px}.stage.no-image .missing{display:grid}.stage.no-image>*:not(.missing){display:none}.visualizer{width:min(100%,1247px);position:relative;min-height:240px;height:clamp(260px,42vh,560px);overflow:hidden;background:radial-gradient(ellipse at 50% 90%,#112e63 0%,#050821 58%,#020616 100%);border-top:2px solid #03dcff;box-shadow:inset 0 14px 30px #00aaff30}.visualizer canvas{display:block;width:100%;height:100%}.visualizer .vtitle{position:absolute;top:13px;left:0;right:0;text-align:center;pointer-events:none;font-size:clamp(12px,2vw,20px);letter-spacing:.15em;font-weight:800;text-shadow:0 0 12px #00dfff}.visualizer .vinfo{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:#a9d7f5;pointer-events:none}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:600px){.visualizer{height:max(260px,calc(100dvh - 100vw * 1261 / 1247 - 18px))}.stage{width:100%;box-shadow:0 0 25px #00d5ff60,0 0 60px #e400ff35}.slogan{font-size:clamp(7px,1.9vw,12px)}.notice{font-size:9px}}
</style></head><body><main class="stage" id="stage" aria-label="TRAVIEXO RADIO, vista previa visual fiel al diseño aprobado"><div class="missing">Falta subir radio-art.jpg a esta rama de GitHub. La interfaz y sus controles ya están preparados.</div><div class="overlay slogan">Donde la música trasciende fronteras.</div><div class="overlay live" id="live">DEMO</div><div class="overlay clock" id="clock">Chicago</div><button class="hit prev" id="prev" aria-label="Programa anterior"></button><button class="hit play" id="play" aria-label="Iniciar prueba de audio"></button><button class="hit next" id="next" aria-label="Programa siguiente"></button><input class="volume" type="range" id="volume" min="0" max="100" value="20" aria-label="Volumen"><div class="notice" id="notice" aria-live="polite">Vista previa · Sin emisión en vivo ni música comercial</div></main><section class="visualizer" aria-label="Visualizador musical de demostración"><div class="vtitle" id="vtitle">ESPECTRO 3D</div><canvas id="viz" aria-hidden="true"></canvas><div class="vinfo" id="vinfo">Animación de demostración · Sin música comercial</div></section><script>
const img=new Image();img.onload=()=>{};img.onerror=()=>document.getElementById('stage').classList.add('no-image');img.src='radio-art.jpg';const shows=['Buenos Días Musicales','México en el Corazón','Pop & Rock Total','Ritmos Latinos','Noches Románticas'];let index=2,ctx,osc,gain;const notice=document.getElementById('notice');function updateTime(){const t=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour:'numeric',minute:'2-digit',hour12:true}).format(new Date());document.getElementById('clock').textContent=t}updateTime();setInterval(updateTime,30000);function select(delta){index=(index+delta+shows.length)%shows.length;pickVisual();notice.textContent='Seleccionado: '+shows[index]+' · Música aún no disponible'}document.getElementById('prev').onclick=()=>select(-1);document.getElementById('next').onclick=()=>select(1);document.getElementById('play').onclick=async()=>{if(osc){osc.stop();osc.disconnect();osc=null;notice.textContent='Prueba de audio detenida';return}try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();osc=ctx.createOscillator();gain=ctx.createGain();osc.type='sine';osc.frequency.value=220;gain.gain.value=.02;osc.connect(gain);gain.connect(ctx.destination);osc.start();notice.textContent='Tono original de prueba · No es una transmisión de radio';pickVisual()}catch(e){notice.textContent='Audio de prueba no disponible'}};document.getElementById('volume').oninput=e=>{if(gain)gain.gain.value=Number(e.target.value)/100*.08};

const canvas=document.getElementById('viz'),pen=canvas.getContext('2d'),names=['ESPECTRO 3D CIRCULAR','ONDA INFINITA','LOBO CELESTIAL + ECUALIZADOR','DJ INFINITY DECK'];let mode=Math.floor(Math.random()*4),last=mode,frame=0;function pickVisual(){let n=(mode+1+Math.floor(Math.random()*3))%4;last=mode;mode=n;document.getElementById('vtitle').textContent=names[mode]}document.getElementById('vtitle').textContent=names[mode];
function render(){const dpr=Math.min(devicePixelRatio||1,2),w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}pen.setTransform(dpr,0,0,dpr,0,0);pen.clearRect(0,0,w,h);const t=frame++*.025,cx=w/2,cy=h*.57,pulse=osc?1:.52;const grad=pen.createLinearGradient(0,0,w,0);grad.addColorStop(0,'#ef16ed');grad.addColorStop(.5,'#00eaff');grad.addColorStop(1,'#b916ff');
function line(points,width=3){pen.beginPath();points.forEach((p,i)=>i?pen.lineTo(p[0],p[1]):pen.moveTo(p[0],p[1]));pen.strokeStyle=grad;pen.lineWidth=width;pen.shadowColor='#00cfff';pen.shadowBlur=16;pen.stroke();pen.shadowBlur=0}
if(mode===0){for(let ring=0;ring<5;ring++){pen.beginPath();pen.ellipse(cx,h*.82,w*(.15+ring*.065),h*(.035+ring*.013),0,0,Math.PI*2);pen.strokeStyle=ring%2?'#e61cff':'#00dfff';pen.lineWidth=2;pen.shadowColor=pen.strokeStyle;pen.shadowBlur=15;pen.stroke()}pen.shadowBlur=0;const count=52;for(let i=0;i<count;i++){let x=w*(.12+i*.76/count),a=Math.pow(Math.sin(i*.29+t*1.6)*Math.cos(i*.11-t*.9),2),bar=(14+a*h*.35*pulse);let g=pen.createLinearGradient(0,h*.77,0,h*.77-bar);g.addColorStop(0,'#00eaff');g.addColorStop(1,i%3?'#e01cff':'#ffb61a');pen.fillStyle=g;pen.shadowBlur=12;pen.shadowColor='#00eaff';pen.fillRect(x,h*.77-bar,w*.008,bar)}pen.shadowBlur=0}
else if(mode===1){for(let k=0;k<6;k++){const pts=[];for(let i=0;i<=280;i++){const a=i/280*Math.PI*2;let rr=Math.sin(2*a),s=1+k*.038;pts.push([cx+Math.cos(a)*w*.34*s,cy+Math.sin(a)*rr*h*.23*s+Math.sin(a*7+t+k*.5)*h*.012*pulse])}line(pts,k===0?5:1.4)}for(let i=0;i<64;i++){let x=w*(.1+i*.8/64),v=(Math.sin(i*.6+t*2)+1)*h*.065*pulse;line([[x,h*.83-v],[x,h*.83+v]],1.6)}}
else if(mode===2) {pen.save();pen.translate(cx,cy-h*.05);pen.scale(Math.min(w/650,1),Math.min(h/450,1));pen.beginPath();pen.moveTo(-150,85);pen.lineTo(-112,-65);pen.lineTo(-80,-30);pen.lineTo(-24,-125);pen.lineTo(12,-68);pen.lineTo(95,-110);pen.lineTo(74,-24);pen.lineTo(152,-7);pen.lineTo(91,25);pen.lineTo(68,100);pen.lineTo(0,145);pen.lineTo(-65,110);pen.closePath();pen.fillStyle='#061d47';pen.strokeStyle='#15dfff';pen.lineWidth=4;pen.shadowColor='#00dfff';pen.shadowBlur=30;pen.fill();pen.stroke();pen.shadowBlur=0;pen.beginPath();pen.arc(-32,-2,6,0,Math.PI*2);pen.fillStyle='#ff3afb';pen.fill();pen.restore();for(let i=0;i<62;i++){const x=w*(.06+i*.88/62),amp=(.25+.75*Math.abs(Math.sin(i*.35+t*1.8)*Math.cos(i*.16-t)))*h*.22*pulse;pen.fillStyle=i%3===0?'#ee24fa':'#08dfff';pen.shadowColor=pen.fillStyle;pen.shadowBlur=10;pen.fillRect(x,h*.92-amp,w*.008,amp)}pen.shadowBlur=0}
else {const decks=[w*.23,w*.77],y=h*.72,rad=Math.min(w*.18,h*.29);for(const [j,x] of decks.entries()){for(let k=0;k<5;k++){pen.beginPath();pen.ellipse(x,y,rad*(1-k*.16),rad*.42*(1-k*.16),0,0,Math.PI*2);pen.strokeStyle=k%2?'#ee23f5':'#00eaff';pen.lineWidth=k===0?4:2;pen.shadowColor=pen.strokeStyle;pen.shadowBlur=14;pen.stroke()}pen.shadowBlur=0;pen.beginPath();pen.ellipse(x,y,rad*.13,rad*.06,0,0,Math.PI*2);pen.fillStyle='#f5eaff';pen.fill();const a=t*(j?-.8:.8);line([[x+Math.cos(a)*rad*.3,y+Math.sin(a)*rad*.12],[x+Math.cos(a)*rad*.9,y+Math.sin(a)*rad*.36]],2)}for(let i=0;i<65;i++){let x=w*(.3+i*.4/65),amp=(.12+.88*Math.abs(Math.sin(i*.37+t*1.7)*Math.cos(i*.12-t*.4)))*h*.4*pulse;pen.fillStyle=i%3===0?'#fa27e8':'#00dcff';pen.shadowColor=pen.fillStyle;pen.shadowBlur=10;pen.fillRect(x,h*.58-amp,w*.006,amp)}pen.shadowBlur=0;for(let k=0;k<4;k++){let pts=[];for(let i=0;i<=140;i++){const x=w*i/140;pts.push([x,h*.37+Math.sin(i*.065+t+k*.5)*h*(.07+k*.014)])}line(pts,1.5)}}
requestAnimationFrame(render)}requestAnimationFrame(render);
</script></body></html>
