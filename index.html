<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020616"><title>TRAVIEXO RADIO</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#020616;color:white;font-family:Arial,system-ui,sans-serif}body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;isolation:isolate;overflow-x:hidden;background:#020616}body::before{content:'';position:fixed;inset:-35px;z-index:-2;background:linear-gradient(180deg,#02061655,#020616a0),url('radio-art.jpg') center center/cover no-repeat;filter:blur(30px) saturate(1.25);transform:scale(1.08)}body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,#020616b8 100%)}.stage{position:relative;width:min(100%,1247px);margin:0 auto;flex:none;box-shadow:0 0 45px #00cfff50,0 0 90px #c500ff2b;aspect-ratio:1247/1261;background:#060a22 url('radio-art.jpg') center/100% 100% no-repeat;overflow:hidden}.overlay{position:absolute;display:flex;align-items:center;justify-content:center}.slogan{left:21%;top:26.2%;width:58%;height:4.2%;background:linear-gradient(90deg,#02071c,#030a20 10%,#02081c 90%,#02071c);font-size:clamp(8px,1.9vw,24px);font-style:italic;text-shadow:0 0 9px #6e9cf9;white-space:nowrap}.live{left:7.7%;top:56.9%;width:13.5%;height:3.1%;border-radius:30px;background:#090a22;box-shadow:inset 0 0 10px #e52ae0,0 0 8px #e52ae0;color:#fff;font-size:clamp(8px,1.25vw,16px);font-weight:800;border:1px solid #f034ba}.clock{right:3.8%;top:32.7%;width:9.7%;height:2.1%;background:#050b23;color:#fff;font-size:clamp(8px,1.3vw,16px);font-weight:800}.play{left:10.2%;top:37.2%;width:8%;height:9%;border:0;border-radius:50%;background:transparent;color:transparent;cursor:pointer}.prev{left:3.4%;top:39.1%;width:4.5%;height:6%}.next{left:20.5%;top:39.1%;width:4.5%;height:6%}.hit{position:absolute;background:transparent;border:0;cursor:pointer;touch-action:manipulation}.play:focus-visible,.hit:focus-visible{outline:3px solid white}.volume{position:absolute;left:9.1%;top:62.2%;width:13.5%;height:2.5%;accent-color:#00dfff;opacity:.08}.volume:focus,.volume:hover{opacity:1}.notice{position:absolute;left:2%;bottom:1%;right:2%;text-align:center;font-size:clamp(8px,1.2vw,14px);background:#02091bdc;padding:4px;border-radius:7px}.missing{position:absolute;inset:0;background:#080c22;display:none;place-items:center;text-align:center;padding:25px;color:#9be8ff;font-size:20px}.stage.no-image .missing{display:grid}.stage.no-image>*:not(.missing){display:none}.visualizer{width:min(100%,1247px);position:relative;aspect-ratio:1/1;overflow:hidden;background:#020616 url('TRAVIEXO%20PULSE%203D.PNG') center/contain no-repeat;border-top:2px solid #03dcff;box-shadow:0 0 35px #00cfff38;isolation:isolate}.visualizer::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 58%,#00eeff16,transparent 43%),linear-gradient(115deg,transparent 38%,#ffffff12 50%,transparent 62%);mix-blend-mode:screen;animation:pulseLight 2.2s ease-in-out infinite alternate}.visualizer::after{content:'';position:absolute;left:12%;right:12%;top:45%;height:24%;border-radius:50%;pointer-events:none;box-shadow:0 0 55px 10px #03d9ff22,0 0 85px 20px #ed21f51b;animation:ringPulse 1.7s ease-in-out infinite alternate}.visualizer canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}.visualizer .vtitle{position:absolute;top:12px;left:0;right:0;text-align:center;pointer-events:none;font-size:clamp(12px,2vw,20px);letter-spacing:.15em;font-weight:800;text-shadow:0 0 12px #00dfff;z-index:2}.visualizer .vinfo{position:absolute;bottom:9px;left:0;right:0;text-align:center;font-size:clamp(9px,1.4vw,12px);color:#b9eaff;text-shadow:0 1px 5px #000;pointer-events:none;z-index:2}@keyframes pulseLight{from{opacity:.25;transform:scale(.99)}to{opacity:1;transform:scale(1.02)}}@keyframes ringPulse{from{opacity:.2;transform:scale(.96)}to{opacity:.9;transform:scale(1.04)}}@media(prefers-reduced-motion:reduce){.visualizer::before,.visualizer::after{animation:none}}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:600px){.visualizer{width:100%;aspect-ratio:1/1}.stage{width:100%;box-shadow:0 0 25px #00d5ff60,0 0 60px #e400ff35}.slogan{font-size:clamp(7px,1.9vw,12px)}.notice{font-size:9px}}
</style></head><body><main class="stage" id="stage" aria-label="TRAVIEXO RADIO, vista previa visual fiel al diseño aprobado"><div class="missing">Falta subir radio-art.jpg a esta rama de GitHub. La interfaz y sus controles ya están preparados.</div><div class="overlay slogan">Donde la música trasciende fronteras.</div><div class="overlay live" id="live">DEMO</div><div class="overlay clock" id="clock">Chicago</div><button class="hit prev" id="prev" aria-label="Programa anterior"></button><button class="hit play" id="play" aria-label="Iniciar prueba de audio"></button><button class="hit next" id="next" aria-label="Programa siguiente"></button><input class="volume" type="range" id="volume" min="0" max="100" value="20" aria-label="Volumen"><div class="notice" id="notice" aria-live="polite">Vista previa · Sin emisión en vivo ni música comercial</div></main><section class="visualizer" aria-label="Visualizador musical de demostración"><div class="vtitle" id="vtitle">TRAVIEXO PULSE 3D</div><canvas id="pulseCanvas" aria-hidden="true"></canvas><div class="vinfo" id="vinfo">Animación de demostración · Sin música comercial</div></section><script>
const img=new Image();img.onload=()=>{};img.onerror=()=>document.getElementById('stage').classList.add('no-image');img.src='radio-art.jpg';const shows=['Buenos Días Musicales','México en el Corazón','Pop & Rock Total','Ritmos Latinos','Noches Románticas'];let index=2,ctx,osc,gain;const notice=document.getElementById('notice');function updateTime(){const t=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour:'numeric',minute:'2-digit',hour12:true}).format(new Date());document.getElementById('clock').textContent=t}updateTime();setInterval(updateTime,30000);function select(delta){index=(index+delta+shows.length)%shows.length;notice.textContent='Seleccionado: '+shows[index]+' · Música aún no disponible'}document.getElementById('prev').onclick=()=>select(-1);document.getElementById('next').onclick=()=>select(1);document.getElementById('play').onclick=async()=>{if(osc){osc.stop();osc.disconnect();osc=null;notice.textContent='Prueba de audio detenida';return}try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();osc=ctx.createOscillator();gain=ctx.createGain();osc.type='sine';osc.frequency.value=220;gain.gain.value=.02;osc.connect(gain);gain.connect(ctx.destination);osc.start();notice.textContent='Tono original de prueba · No es una transmisión de radio'}catch(e){notice.textContent='Audio de prueba no disponible'}};document.getElementById('volume').oninput=e=>{if(gain)gain.gain.value=Number(e.target.value)/100*.08};

const pulseCanvas=document.getElementById('pulseCanvas'),pctx=pulseCanvas.getContext('2d');let pulseFrame=0;
function animatePulse(){
 const w=pulseCanvas.clientWidth,h=pulseCanvas.clientHeight;
 if(!w||!h){requestAnimationFrame(animatePulse);return}
 const dpr=Math.min(window.devicePixelRatio||1,2);
 if(pulseCanvas.width!==Math.round(w*dpr)||pulseCanvas.height!==Math.round(h*dpr)){pulseCanvas.width=Math.round(w*dpr);pulseCanvas.height=Math.round(h*dpr)}
 pctx.setTransform(dpr,0,0,dpr,0,0);pctx.clearRect(0,0,w,h);
 const t=performance.now()/1000,active=!!osc;
 const base=h*.724,top=h*.16,left=w*.145,right=w*.86;
 // Darken the printed equalizer while retaining the original chrome platform.
 const shade=pctx.createLinearGradient(0,top,0,base);
 shade.addColorStop(0,'rgba(2,3,18,.82)');shade.addColorStop(.7,'rgba(2,3,18,.76)');shade.addColorStop(1,'rgba(2,3,18,0)');
 pctx.fillStyle=shade;pctx.fillRect(left,top,right-left,base-top);
 const n=25,step=(right-left)/n,bw=step*.68;
 for(let i=0;i<n;i++){
  const x=left+(i+.5)*step;
  const shape=1-Math.abs(i-(n-1)/2)/((n-1)/2);
  const wave=Math.abs(Math.sin(t*2.8+i*.57)*Math.cos(t*1.35-i*.32));
  const energy=(.12+.88*wave)*(active?1:.84);
  const height=h*(.14+shape*.30)*energy;
  const pink=shape<.48,blue=shape>.73;
  const color=pink?'255,42,235':blue?'0,235,255':'38,140,255';
  const segment=h*.012,gap=h*.005;
  pctx.shadowColor='rgb('+color+')';pctx.shadowBlur=w*.013;
  for(let y=base-segment;y>base-height;y-=segment+gap){
   const opacity=.65+.35*Math.sin(t*2+i*.3)**2;
   pctx.fillStyle='rgba('+color+','+opacity+')';
   pctx.fillRect(x-bw/2,y,bw,segment);
  }
 }
 pctx.shadowBlur=0;
 // Bright moving scan beam makes motion perceptible even without audio.
 const scanY=base-(.5+.5*Math.sin(t*1.8))*(base-top)*.85;
 const beam=pctx.createLinearGradient(left,0,right,0);
 beam.addColorStop(0,'rgba(255,36,241,0)');beam.addColorStop(.25,'rgba(255,36,241,.35)');beam.addColorStop(.5,'rgba(0,255,255,.65)');beam.addColorStop(.75,'rgba(255,36,241,.35)');beam.addColorStop(1,'rgba(255,36,241,0)');
 pctx.fillStyle=beam;pctx.fillRect(left,scanY,right-left,Math.max(2,h*.005));
 requestAnimationFrame(animatePulse);
}
if(pctx)requestAnimationFrame(animatePulse);
</script></body></html>
