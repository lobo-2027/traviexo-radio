<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TRAVIEXO MUSIC · Artistas (prueba)</title><style>:root{color-scheme:dark;--gold:#f5ca79;--edge:#b78b4e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 35% 0%,#4b2b10 0%,#100b0a 48%,#060608 100%);color:#f5e0b4;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:16px 16px 80px}.player{position:sticky;top:8px;z-index:5;padding:16px;border:1px solid var(--gold);border-radius:25px;background:rgba(20,12,9,.78);backdrop-filter:blur(22px);box-shadow:0 8px 30px #0009;text-align:center}.brand{font-size:21px;letter-spacing:3px;font-weight:800;color:var(--gold)}.now{margin:10px 0;color:#fff}.controls{display:flex;justify-content:center;gap:12px}.controls button{min-width:55px}button{border:1px solid var(--edge);border-radius:15px;background:linear-gradient(130deg,#402816,#1b1411);color:var(--gold);font:inherit;padding:12px 16px;cursor:pointer}button:focus-visible,.tile:focus-visible{outline:2px solid #fff}.heading{display:flex;align-items:center;gap:14px;margin:25px 0 18px}.heading h1{font-size:26px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.tile{border:1px solid var(--edge);border-radius:23px;overflow:hidden;background:linear-gradient(#302016,#09090b);text-align:left;cursor:pointer;color:#fff;min-width:0}.cover{height:auto;aspect-ratio:1/1;display:grid;place-items:center;font-size:65px;color:#ffe5aa;position:relative;overflow:hidden}.cover:after{content:'';position:absolute;inset:8px;border:1px solid #ffd38c60;border-radius:15px}.cover.gold{background:radial-gradient(circle at 50% 35%,#ffdb84,#7d4c24 48%,#12111c 85%)}.cover.orange{background:linear-gradient(145deg,#1c0b1d,#8d3d1e,#170d14)}.cover.blue{background:radial-gradient(circle,#a8dfff,#17446b 45%,#081023 85%)}.cover.rose{background:radial-gradient(circle,#c95e7c,#5c1b39 50%,#160b1b 90%)}.meta{padding:12px}.meta b{display:block;font-size:17px;overflow-wrap:anywhere}.meta small{display:block;margin-top:6px;color:#d4aa72;line-height:1.4}.track{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;margin:9px 0}.track span{flex:1}.track small{display:block;color:#bda080;margin-top:5px}.sub{color:#c8a77c;margin:0 0 18px}.hidden{display:none}input{width:100%;border:1px solid var(--edge);border-radius:15px;padding:14px;background:#0d0b0c;color:#fff;font-size:16px;margin:8px 0 18px}.pill{margin:16px 0 4px;display:inline-block;color:#bca17b;font-size:13px}#message{font-size:13px;color:#d9b987;margin-top:10px}</style></head><body><div class="wrap"><header class="player"><div class="brand">TRAVIEXO MUSIC</div><div class="now" id="now">Selecciona una canción</div><div class="controls"><button id="prev" aria-label="Anterior">⏮</button><button id="play" aria-label="Reproducir">▶</button><button id="next" aria-label="Siguiente">⏭</button></div><div id="message">Catálogo de demostración · Sin audio</div></header><main><div class="heading"><button id="back" class="hidden">← Regresar</button><h1 id="title">Artistas</h1></div><div id="home"><p class="sub">Selecciona un artista para explorar sus álbumes y canciones.</p><input id="search" placeholder="Buscar artistas o álbumes" aria-label="Buscar artistas o álbumes"><div id="artistGrid" class="grid"></div></div><div id="artistView" class="hidden"><p class="sub" id="artistDesc"></p><div id="albumGrid" class="grid"></div></div><div id="albumView" class="hidden"><p class="sub" id="albumDesc"></p><div id="tracks"></div></div><span class="pill">PROTOTIPO INDEPENDIENTE · No modifica la versión oficial</span></main></div><script>const artists=[{name:'Luz de Medianoche',tone:'gold',symbol:'☾',album:'Noches de Oro',tracks:['Brillo de Luna','Caminos de Cristal','Último Destello']},{name:'Sonido del Barrio',tone:'orange',symbol:'♫',album:'Ritmo de la Calle',tracks:['Bailando en la Plaza','Cumbia de Medianoche','Corazón Sonidero']},{name:'Horizonte Azul',tone:'blue',symbol:'✦',album:'Entre Estrellas',tracks:['Cielo Infinito','Luz del Horizonte','Más Allá del Sol']},{name:'Alma Serena',tone:'rose',symbol:'♡',album:'Ecos del Corazón',tracks:['Susurros','Ecos del Corazón','Siempre Contigo']}];let page='home',chosen=null,queue=[],current=-1;const $=id=>document.getElementById(id);function cover(a){return `<div class="cover ${a.tone}" aria-hidden="true">${a.symbol}</div>`}function tile(a,title,subtitle,action){const el=document.createElement('button');el.className='tile';el.innerHTML=cover(a)+`<div class="meta"><b>${title}</b><small>${subtitle}</small></div>`;el.onclick=action;return el}function show(p){page=p;['home','artistView','albumView'].forEach(id=>$(id).classList.toggle('hidden',id!==(p==='home'?'home':p==='artist'?'artistView':'albumView')));$('back').classList.toggle('hidden',p==='home');$('title').textContent=p==='home'?'Artistas':p==='artist'?chosen.name:chosen.album;window.scrollTo({top:0,behavior:'instant'})}function renderHome(q=''){$('artistGrid').replaceChildren();artists.filter(a=>(a.name+' '+a.album).toLowerCase().includes(q.toLowerCase())).forEach(a=>$('artistGrid').append(tile(a,a.name,'1 álbum · 3 canciones',()=>{chosen=a;renderArtist()})))}function renderArtist(){$('artistDesc').textContent=`${chosen.name} · Explora sus álbumes`; $('albumGrid').replaceChildren(tile(chosen,chosen.album,'3 canciones de demostración',renderAlbum));show('artist')}function renderAlbum(){$('albumDesc').textContent=`${chosen.name} · ${chosen.album} · 3 canciones`;const target=$('tracks');target.replaceChildren();chosen.tracks.forEach((name,i)=>{let b=document.createElement('button');b.className='track';b.innerHTML=`<span><b>${i+1}. ${name}</b><small>${chosen.name} · ${chosen.album}</small></span><strong>▶</strong>`;b.onclick=()=>{queue=chosen.tracks.map(t=>({name:t,artist:chosen.name}));current=i;setTrack()};target.append(b)});show('album')}function setTrack(){if(current<0||!queue[current])return;$('now').textContent=`${queue[current].name} · ${queue[current].artist}`;$('message').textContent='Pista de demostración: no hay audio asociado';$('play').textContent='▶'}$('back').onclick=()=>page==='album'?renderArtist():show('home');$('search').oninput=e=>renderHome(e.target.value);$('play').onclick=()=>{$('message').textContent='Esta canción es ficticia y no tiene audio. El reproductor real no se ha modificado.'};$('next').onclick=()=>{if(queue.length){current=(current+1)%queue.length;setTrack()}};$('prev').onclick=()=>{if(queue.length){current=(current-1+queue.length)%queue.length;setTrack()}};renderHome();</script></body></html>
